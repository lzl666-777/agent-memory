[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Decision memory for AI agents: remember what was decided, record what happened, recall lessons before the next decision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "memory", "decision", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
agent-memory-mcp = "agent_memory.mcp_server:main"

[tool.setuptools.packages.find]
include = ["agent_memory*"]
